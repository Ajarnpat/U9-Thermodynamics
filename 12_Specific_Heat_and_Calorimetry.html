<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12. Specific Heat & Calorimetry</title><style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --ink:#edf6ff; --muted:#9db3c7;
  --accent:#5de1d0; --accent2:#72a7ff; --warn:#ffcc66; --hot:#ff7b69; --cold:#73b7ff;
  --line:rgba(255,255,255,.12); --shadow:0 18px 55px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 20% -10%,#153454 0,transparent 42%),linear-gradient(180deg,#07111f,#081625 55%,#07111f)}
.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,14,25,.78);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-left:10px;font-weight:500}
header .actions{display:flex;gap:8px}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#132740;color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);border-color:rgba(93,225,208,.5)}button.primary{background:linear-gradient(135deg,#16776d,#1b4f73);border-color:rgba(93,225,208,.45)}button.ghost{background:transparent}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:12px}
.stage,.side{min-height:0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(18,39,63,.96),rgba(10,25,42,.96));box-shadow:var(--shadow);overflow:hidden}
.stage{position:relative;display:flex;min-width:0}.stage canvas{width:100%;height:100%;display:block}
.side{padding:14px;overflow:auto;scrollbar-width:thin}.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:2px 0 10px}.control{margin:11px 0 15px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.control .value{color:var(--accent);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:#5de1d0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.readout{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,14,25,.38)}.readout .k{font-size:11px;color:var(--muted)}.readout .v{font-size:18px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}.readout .u{font-size:10px;color:var(--muted);margin-left:2px}
.note{font-size:12px;line-height:1.45;color:#bed0df;border-left:3px solid rgba(93,225,208,.45);padding:8px 10px;background:rgba(93,225,208,.06);border-radius:0 10px 10px 0;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tabs button.active{background:#1d5b6d;border-color:#58d7c8}
.equation{font-family:"Cambria Math",Cambria,Georgia,serif;text-align:center;font-size:18px;padding:9px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin:10px 0}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#c7d6e3;background:rgba(4,12,22,.62);border:1px solid var(--line);border-radius:10px;padding:7px 9px;backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:6px}.sw{width:8px;height:8px;border-radius:50%}
.help{position:fixed;inset:70px 24px 24px;z-index:20;background:rgba(7,17,31,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:none;overflow:auto}.help.show{display:block}.help h3{margin-top:0}.help p,.help li{color:#c6d7e5;line-height:1.55}.help .close{position:absolute;right:14px;top:14px}
.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:62vh auto}.side{overflow:visible}.sub{display:none}}
</style></head>
<body><div class="app"><header><div class="brand"><span class="dot"></span><h1>12. Specific Heat & Calorimetry<span class="sub">AP Physics 2 - Unit 9</span></h1></div><div class="actions"><button class="ghost" onclick="location.href='index.html'">Home</button><button class="ghost" data-help>How to use</button><button id="resetBtn">Reset</button></div></header>
<div class="main"><section class="stage"><canvas id="c"></canvas></section><aside class="side"><h2>Calorimetry lab</h2><div class="tabs"><button class="active" data-mode="heat">Heating</button><button data-mode="mix">Mixing</button></div><div class="control"><label>Material <span class="value" id="matOut">Aluminum</span></label><select id="mat"><option value="900">Aluminum</option><option value="385">Copper</option><option value="450">Iron/steel</option><option value="4186">Water</option></select></div><div class="control"><label>Mass <span class="value" id="mOut"></span></label><input id="mass" type="range" min="0.05" max="0.50" value="0.20" step="0.01"></div><div class="control" id="powerCtl"><label>Heater power <span class="value" id="pOut"></span></label><input id="power" type="range" min="20" max="150" value="80" step="5"></div><div class="readouts"><div class="readout"><div class="k" id="tempLabel">Sample temperature</div><div class="v" id="tRead">20.0 °C</div></div><div class="readout"><div class="k" id="qLabel">Energy transferred to sample</div><div class="v" id="qRead">0 J</div></div><div class="readout" id="waterBox" style="display:none"><div class="k">Energy gained by water</div><div class="v" id="qwRead">0 J</div></div><div class="readout" id="balanceBox" style="display:none"><div class="k">Energy balance</div><div class="v" id="balanceRead" style="font-size:14px">-</div></div></div><div class="row"><button id="run" class="primary">Start</button><button id="resetLocal">Reset trial</button></div><div class="equation">Q = mcΔT</div><div class="note" id="note">Compare temperature rises for equal masses receiving the same energy.</div></aside></div></div>
<div class="help"><button class="close" data-close>Close</button><div class="content"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.querySelectorAll('[id]').forEach(el=>{if(!(el.id in window)) window[el.id]=el;});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(x,d=1)=>Number(x).toFixed(d);
function setupCanvas(id='c'){
 const c=document.getElementById(id),ctx=c.getContext('2d');
 function resize(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
 window.addEventListener('resize',resize);resize();return [c,ctx];
}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grid(ctx,x,y,w,h,nx=6,ny=5){ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let i=0;i<=nx;i++){let xx=x+w*i/nx;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}for(let j=0;j<=ny;j++){let yy=y+h*j/ny;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}ctx.restore()}
function circle(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function bindRange(id,out,fn){const el=document.getElementById(id),o=document.getElementById(out);const go=()=>{o.textContent=fn(+el.value)};el.addEventListener('input',go);go();return el}
function helpText(html){document.querySelector('.help .content').innerHTML=html}
document.addEventListener('click',e=>{if(e.target.matches('[data-help]'))document.querySelector('.help').classList.add('show');if(e.target.matches('[data-close]'))document.querySelector('.help').classList.remove('show')});

helpText('<h3>Specific heat and calorimetry</h3><p>Heating mode uses Q=mcΔT. In Mixing mode, a hot sample at 90 °C is placed in 0.20 kg of water at 20 °C in an ideal insulated calorimeter.</p><p>Mixing mode now shows the two energy changes separately: energy lost by the hot sample equals energy gained by the water. The model neglects the calorimeter/thermometer heat capacities and energy losses.</p>');
const [c,ctx]=setupCanvas();let mode='heat',running=false,T=20,Q=0,last=performance.now(),history=[],mix=null;const mat=$('#mat'),mass=bindRange('mass','mOut',x=>fmt(x,2)+' kg'),power=bindRange('power','pOut',x=>x+' W');mat.onchange=()=>matOut.textContent=mat.options[mat.selectedIndex].text;
function setMode(m){mode=m;$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));powerCtl.style.display=m==='heat'?'block':'none';waterBox.style.display=m==='mix'?'block':'none';balanceBox.style.display=m==='mix'?'block':'none';tempLabel.textContent=m==='heat'?'Sample temperature':'Equilibrium temperature';qLabel.textContent=m==='heat'?'Energy transferred to sample':'Energy lost by hot sample';note.textContent=m==='heat'?'Compare temperature rises for equal masses receiving the same energy.':'Mix the selected hot material at 90 °C with 0.20 kg of water at 20 °C. Ideal model: Q_hot + Q_water = 0.';resetTrial()}
$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function resetTrial(){running=false;run.textContent=mode==='heat'?'Start':'Mix';T=mode==='heat'?20:90;Q=0;history=[];mix=null;qwRead.textContent='0 J';balanceRead.textContent='-'}
run.onclick=()=>{if(mode==='mix'){let cmat=+mat.value,m=+mass.value,mw=.2,cw=4186,Th=90,Tw=20,Teq=(m*cmat*Th+mw*cw*Tw)/(m*cmat+mw*cw),Qhot=m*cmat*(Teq-Th),Qwater=mw*cw*(Teq-Tw);T=Teq;Q=-Qhot;mix={Teq,Qhot,Qwater};history=[[0,Th,Tw],[1,Teq,Teq]];qwRead.textContent=(Qwater>=0?'+':'')+Math.round(Qwater)+' J';balanceRead.textContent=Math.abs(Qhot+Qwater)<.01?'Qhot + Qwater = 0 ✓':'Check'}else{running=!running;run.textContent=running?'Pause':'Start'}};resetLocal.onclick=resetTrial;resetBtn.onclick=()=>{mat.value=900;mat.onchange();mass.value=.2;power.value=80;mass.dispatchEvent(new Event('input'));power.dispatchEvent(new Event('input'));setMode('heat')};
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(mode==='heat'&&running){let dQ=(+power.value)*dt;Q+=dQ;T+=dQ/((+mass.value)*(+mat.value));if(history.length<600)history.push([Q,T])}let w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);let gx=w*.52,gy=90,gw=w*.4,gh=h-160;
 if(mode==='heat'){
  let bx=80,by=105,bw=w*.34,bh=h-190;ctx.fillStyle='rgba(150,170,185,.7)';rounded(ctx,bx,by,bw,bh,18);ctx.fill();let f=clamp((T-20)/100,0,1);ctx.fillStyle=`rgba(255,${Math.round(170-80*f)},${Math.round(120-60*f)},.7)`;ctx.fillRect(bx+10,by+bh*(1-f*.75)-10,bw-20,bh*f*.75+10);ctx.fillStyle='#edf6ff';ctx.font='700 26px system-ui';ctx.fillText('Heated sample',bx,55);grid(ctx,gx,gy,gw,gh);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.stroke();if(history.length>1){let xmax=Math.max(2000,Q),ymin=15,ymax=130;ctx.strokeStyle='#ffcc66';ctx.lineWidth=2.5;ctx.beginPath();history.forEach((p,i)=>{let xx=gx+p[0]/xmax*gw,yy=gy+gh-(p[1]-ymin)/(ymax-ymin)*gh;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke()}ctx.fillStyle='#9db3c7';ctx.font='11px system-ui';ctx.fillText('Q (J)',gx+gw-28,gy+gh-8);ctx.save();ctx.translate(gx+10,gy+40);ctx.rotate(-Math.PI/2);ctx.fillText('T (°C)',0,0);ctx.restore();
 } else {
  let x1=65,x2=w*.31,by=125,bw=w*.20,bh=h*.42;ctx.fillStyle='#c77658';rounded(ctx,x1,by,bw,bh,18);ctx.fill();ctx.fillStyle='#487cab';rounded(ctx,x2,by,bw,bh,18);ctx.fill();ctx.fillStyle='#edf6ff';ctx.font='700 22px system-ui';ctx.fillText('Hot sample',x1,62);ctx.fillText('Water',x2,62);ctx.fillStyle='#dce8f2';ctx.font='14px system-ui';ctx.fillText('Initial: 90 °C',x1+14,by+30);ctx.fillText('Initial: 20 °C',x2+14,by+30);ctx.fillText(mix?'Final: '+fmt(T,1)+' °C':'Final: —',x1+14,by+56);ctx.fillText(mix?'Final: '+fmt(T,1)+' °C':'Final: —',x2+14,by+56);ctx.fillStyle='#9db3c7';ctx.font='12px system-ui';ctx.fillText(mix?'Q = '+Math.round(mix.Qhot)+' J':'Q = —',x1+14,by+82);ctx.fillText(mix?'Q = +'+Math.round(mix.Qwater)+' J':'Q = —',x2+14,by+82);grid(ctx,gx,gy,gw,gh);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.stroke();if(mix){let ymap=v=>gy+gh-(v/100)*gh;ctx.strokeStyle='#ffcc66';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx,ymap(90));ctx.lineTo(gx+gw,ymap(T));ctx.stroke();ctx.strokeStyle='#73b7ff';ctx.beginPath();ctx.moveTo(gx,ymap(20));ctx.lineTo(gx+gw,ymap(T));ctx.stroke()}ctx.fillStyle='#9db3c7';ctx.font='11px system-ui';ctx.fillText('mixing → equilibrium',gx+gw-100,gy+gh-8);ctx.save();ctx.translate(gx+10,gy+40);ctx.rotate(-Math.PI/2);ctx.fillText('T (°C)',0,0);ctx.restore();
 }
 tRead.textContent=fmt(T,1)+' °C';qRead.textContent=Math.round(Q)+' J';requestAnimationFrame(frame)}
setMode('heat');requestAnimationFrame(frame);
</script></body></html>
