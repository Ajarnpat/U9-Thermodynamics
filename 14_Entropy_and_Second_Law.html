<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14. Entropy & the Second Law</title><style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --ink:#edf6ff; --muted:#9db3c7;
  --accent:#5de1d0; --accent2:#72a7ff; --warn:#ffcc66; --hot:#ff7b69; --cold:#73b7ff;
  --line:rgba(255,255,255,.12); --shadow:0 18px 55px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 20% -10%,#153454 0,transparent 42%),linear-gradient(180deg,#07111f,#081625 55%,#07111f)}
.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,14,25,.78);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-left:10px;font-weight:500}
header .actions{display:flex;gap:8px}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#132740;color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);border-color:rgba(93,225,208,.5)}button.primary{background:linear-gradient(135deg,#16776d,#1b4f73);border-color:rgba(93,225,208,.45)}button.ghost{background:transparent}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:12px}
.stage,.side{min-height:0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(18,39,63,.96),rgba(10,25,42,.96));box-shadow:var(--shadow);overflow:hidden}
.stage{position:relative;display:flex;min-width:0}.stage canvas{width:100%;height:100%;display:block}
.side{padding:14px;overflow:auto;scrollbar-width:thin}.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:2px 0 10px}.control{margin:11px 0 15px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.control .value{color:var(--accent);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:#5de1d0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.readout{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,14,25,.38)}.readout .k{font-size:11px;color:var(--muted)}.readout .v{font-size:18px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}.readout .u{font-size:10px;color:var(--muted);margin-left:2px}
.note{font-size:12px;line-height:1.45;color:#bed0df;border-left:3px solid rgba(93,225,208,.45);padding:8px 10px;background:rgba(93,225,208,.06);border-radius:0 10px 10px 0;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tabs button.active{background:#1d5b6d;border-color:#58d7c8}
.equation{font-family:"Cambria Math",Cambria,Georgia,serif;text-align:center;font-size:18px;padding:9px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin:10px 0}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#c7d6e3;background:rgba(4,12,22,.62);border:1px solid var(--line);border-radius:10px;padding:7px 9px;backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:6px}.sw{width:8px;height:8px;border-radius:50%}
.help{position:fixed;inset:70px 24px 24px;z-index:20;background:rgba(7,17,31,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:none;overflow:auto}.help.show{display:block}.help h3{margin-top:0}.help p,.help li{color:#c6d7e5;line-height:1.55}.help .close{position:absolute;right:14px;top:14px}
.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:62vh auto}.side{overflow:visible}.sub{display:none}}
</style></head>
<body><div class="app"><header><div class="brand"><span class="dot"></span><h1>14. Entropy & the Second Law<span class="sub">AP Physics 2 - Unit 9</span></h1></div><div class="actions"><button class="ghost" onclick="location.href='index.html'">Home</button><button class="ghost" data-help>How to use</button><button id="resetBtn">Reset</button></div></header>
<div class="main"><section class="stage"><canvas id="c"></canvas></section><aside class="side"><h2>Statistical spreading</h2><div class="control"><label>Number of particles N <span class="value" id="nOut">80</span></label><select id="num" style="width:100%;padding:8px;border-radius:10px;background:#132740;color:#edf6ff;border:1px solid rgba(255,255,255,.12)"><option value="10">10</option><option value="80" selected>80</option><option value="200">200</option><option value="1000">1,000</option><option value="10000">10,000</option><option value="100000">100,000</option></select></div><div class="control"><label>Initial left fraction <span class="value" id="fOut"></span></label><input id="frac" type="range" min="0.5" max="1" value="1" step="0.05"></div><div class="readouts"><div class="readout"><div class="k">Left / right (full N)</div><div class="v" id="countRead">-</div></div><div class="readout"><div class="k">Relative multiplicity</div><div class="v" id="multRead">-</div></div><div class="readout"><div class="k">Visible dots</div><div class="v" id="visRead">-</div></div><div class="readout"><div class="k">Model</div><div class="v" id="modelRead" style="font-size:13px">-</div></div></div><div class="row"><button id="divider" class="primary">Remove divider</button><button id="pauseBtn">Pause</button></div><div class="row"><button id="reverse">Reverse velocities</button><button id="reseed">New microstate</button></div><div class="note" id="modeNote">For N≤200 every particle is simulated and drawn. Larger N uses an aggregate statistical model for the full population plus representative moving dots.</div></aside></div></div>
<div class="help"><button class="close" data-close>Close</button><div class="content"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.querySelectorAll('[id]').forEach(el=>{if(!(el.id in window)) window[el.id]=el;});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(x,d=1)=>Number(x).toFixed(d);
function setupCanvas(id='c'){
 const c=document.getElementById(id),ctx=c.getContext('2d');
 function resize(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
 window.addEventListener('resize',resize);resize();return [c,ctx];
}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grid(ctx,x,y,w,h,nx=6,ny=5){ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let i=0;i<=nx;i++){let xx=x+w*i/nx;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}for(let j=0;j<=ny;j++){let yy=y+h*j/ny;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}ctx.restore()}
function circle(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function bindRange(id,out,fn){const el=document.getElementById(id),o=document.getElementById(out);const go=()=>{o.textContent=fn(+el.value)};el.addEventListener('input',go);go();return el}
function helpText(html){document.querySelector('.help .content').innerHTML=html}
document.addEventListener('click',e=>{if(e.target.matches('[data-help]'))document.querySelector('.help').classList.add('show');if(e.target.matches('[data-close]'))document.querySelector('.help').classList.remove('show')});

helpText('<h3>Entropy and the Second Law</h3><p>Use N=10, 80 and 200 exactly as in the worksheet. For these cases every particle is explicitly simulated. Extra choices 1,000–100,000 show how fractional fluctuations shrink for larger populations; their left/right counts come from a full-population statistical exchange model while only representative dots are drawn.</p><p>At N≤200, <b>Reverse velocities</b> reverses every simulated velocity. With the divider still open and no intervention, the trajectories approximately retrace their microscopic history—illustrating that microscopic reversibility is not the same as a spontaneous macroscopic entropy decrease.</p>');
const [c,ctx]=setupCanvas();let ps=[],open=false,paused=false,last=performance.now(),acc=0,fullN=80,leftCount=80,statMode=false,reverseRemaining=null;const num=$('#num'),frac=bindRange('frac','fOut',x=>Math.round(x*100)+'% left');
function logGamma(z){let x=z;const c=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.984369578019571e-6,1.5056327351493116e-7];if(x<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*x))-logGamma(1-x);x-=1;let a=.9999999999998099;for(let i=0;i<c.length;i++)a+=c[i]/(x+i+1);let t=x+c.length-.5;return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a)}
function logComb(n,k){if(k<0||k>n)return -Infinity;return logGamma(n+1)-logGamma(k+1)-logGamma(n-k+1)}
function binomialSample(n,p){if(n<=0)return 0;if(n<60){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k}let mean=n*p,sd=Math.sqrt(n*p*(1-p)),u1=Math.max(1e-12,Math.random()),u2=Math.random(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);return clamp(Math.round(mean+sd*z),0,n)}
function makeParticle(left){let a=Math.random()*Math.PI*2,s=.5+Math.random()*.7;return {x:left?Math.random()*.49:.51+Math.random()*.49,y:Math.random(),vx:Math.cos(a)*s,vy:Math.sin(a)*s,comp:left?'L':'R'}}
function init(){fullN=+num.value;statMode=fullN>200;let f=+frac.value;leftCount=Math.round(fullN*f);ps=[];let visible=statMode?200:fullN,visLeft=Math.round(visible*f);for(let i=0;i<visible;i++)ps.push(makeParticle(i<visLeft));open=false;paused=false;pauseBtn.textContent='Pause';reverseRemaining=null;divider.textContent='Remove divider';divider.classList.add('primary');nOut.textContent=fullN.toLocaleString();reverse.disabled=statMode;reverse.style.opacity=statMode?'.45':'1';reverse.title=statMode?'Exact velocity reversal is available for N≤200, where every particle is explicitly simulated.':'';modeNote.innerHTML=statMode?'Full-population <b>statistics use N='+fullN.toLocaleString()+'</b>; only 200 representative dots are animated. Reverse velocities is disabled because those dots are not the full microstate.':'Every selected particle is explicitly simulated and drawn. Reverse velocities reverses the complete simulated microstate.'}
num.onchange=init;frac.onchange=init;
divider.onclick=()=>{open=!open;if(!open)ps.forEach(p=>p.comp=p.x<.5?'L':'R');divider.textContent=open?'Insert divider':'Remove divider';divider.classList.toggle('primary',!open);if(open)acc=0};pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'};
reverse.onclick=()=>{if(statMode)return;ps.forEach(p=>{p.vx*=-1;p.vy*=-1});reverseRemaining=open?acc:null;modeNote.innerHTML=open?'All velocities reversed. With no further intervention, the particles should approximately retrace their previous microscopic trajectories.':'Velocities reversed. Remove the divider first if you want to explore microscopic retracing.'};reseed.onclick=init;resetBtn.onclick=()=>{num.value='80';frac.value=1;frac.dispatchEvent(new Event('input'));init()};
function reflect(p,dt,minX,maxX){let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;while(nx<minX||nx>maxX){if(nx<minX){nx=2*minX-nx;p.vx*=-1}else{nx=2*maxX-nx;p.vx*=-1}}while(ny<0||ny>1){if(ny<0){ny=-ny;p.vy*=-1}else{ny=2-ny;p.vy*=-1}}p.x=nx;p.y=ny}
function stepSmall(dt){for(const p of ps){if(open)reflect(p,dt,0,1);else reflect(p,dt,p.comp==='L'?0:.5,p.comp==='L'?.5:1)}leftCount=ps.reduce((s,p)=>s+(p.x<.5?1:0),0)}
function stepLarge(dt){for(const p of ps){if(open)reflect(p,dt,0,1);else reflect(p,dt,p.comp==='L'?0:.5,p.comp==='L'?.5:1)}if(open){let lambda=.95,p=1-Math.exp(-lambda*dt),lr=binomialSample(leftCount,p),rl=binomialSample(fullN-leftCount,p);leftCount=clamp(leftCount-lr+rl,0,fullN)}}
function frame(now){let realdt=Math.min(.05,(now-last)/1000);last=now;let simdt=realdt*.24;if(!paused){if(open)acc+=simdt;if(statMode)stepLarge(simdt);else stepSmall(simdt);if(reverseRemaining!==null&&open){reverseRemaining-=simdt;if(reverseRemaining<=0){reverseRemaining=null;modeNote.innerHTML='The precisely reversed small-N microstate has retraced close to its earlier state. This is engineered microscopic reversal—not a spontaneous macroscopic fluctuation.'}}}
 let w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);let bx=55,by=90,bw=w-110,bh=h-155;rounded(ctx,bx,by,bw,bh,18);ctx.fillStyle='rgba(4,12,22,.42)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.stroke();if(!open){ctx.strokeStyle='#ffcc66';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bx+bw/2,by+5);ctx.lineTo(bx+bw/2,by+bh-5);ctx.stroke()}for(const p of ps)circle(ctx,bx+8+p.x*(bw-16),by+8+p.y*(bh-16),statMode?2.5:3.2,'#78dcca');
 let right=fullN-leftCount,logM=logComb(fullN,leftCount),logMax=logComb(fullN,Math.floor(fullN/2)),deltaLog=logM-logMax,rel=deltaLog<-18?0:Math.exp(deltaLog)*100;countRead.textContent=`${leftCount.toLocaleString()} / ${right.toLocaleString()}`;multRead.textContent=rel===0?'<0.000001%':rel<.01?'<0.01%':fmt(rel,1)+'%';visRead.textContent=ps.length.toLocaleString();modelRead.textContent=statMode?'aggregate + sample':'full dynamics';ctx.fillStyle='#edf6ff';ctx.font='700 24px system-ui';ctx.fillText('Entropy and probability: why equilibrium dominates',55,44);ctx.fillStyle='#9db3c7';ctx.font='13px system-ui';ctx.fillText(statMode?'Full N controls the statistics; 200 dots are representative.':'Every dot shown is one particle in this small-N model.',55,66);requestAnimationFrame(frame)}
init();requestAnimationFrame(frame);
</script></body></html>
