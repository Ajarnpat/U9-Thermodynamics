<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9. First Law of Thermodynamics</title><style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --ink:#edf6ff; --muted:#9db3c7;
  --accent:#5de1d0; --accent2:#72a7ff; --warn:#ffcc66; --hot:#ff7b69; --cold:#73b7ff;
  --line:rgba(255,255,255,.12); --shadow:0 18px 55px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 20% -10%,#153454 0,transparent 42%),linear-gradient(180deg,#07111f,#081625 55%,#07111f)}
.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,14,25,.78);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-left:10px;font-weight:500}
header .actions{display:flex;gap:8px}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#132740;color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);border-color:rgba(93,225,208,.5)}button.primary{background:linear-gradient(135deg,#16776d,#1b4f73);border-color:rgba(93,225,208,.45)}button.ghost{background:transparent}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:12px}
.stage,.side{min-height:0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(18,39,63,.96),rgba(10,25,42,.96));box-shadow:var(--shadow);overflow:hidden}
.stage{position:relative;display:flex;min-width:0}.stage canvas{width:100%;height:100%;display:block}
.side{padding:14px;overflow:auto;scrollbar-width:thin}.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:2px 0 10px}.control{margin:11px 0 15px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.control .value{color:var(--accent);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:#5de1d0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.readout{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,14,25,.38)}.readout .k{font-size:11px;color:var(--muted)}.readout .v{font-size:18px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}.readout .u{font-size:10px;color:var(--muted);margin-left:2px}
.note{font-size:12px;line-height:1.45;color:#bed0df;border-left:3px solid rgba(93,225,208,.45);padding:8px 10px;background:rgba(93,225,208,.06);border-radius:0 10px 10px 0;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tabs button.active{background:#1d5b6d;border-color:#58d7c8}
.equation{font-family:"Cambria Math",Cambria,Georgia,serif;text-align:center;font-size:18px;padding:9px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin:10px 0}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#c7d6e3;background:rgba(4,12,22,.62);border:1px solid var(--line);border-radius:10px;padding:7px 9px;backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:6px}.sw{width:8px;height:8px;border-radius:50%}
.help{position:fixed;inset:70px 24px 24px;z-index:20;background:rgba(7,17,31,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:none;overflow:auto}.help.show{display:block}.help h3{margin-top:0}.help p,.help li{color:#c6d7e5;line-height:1.55}.help .close{position:absolute;right:14px;top:14px}
.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:62vh auto}.side{overflow:visible}.sub{display:none}}
</style></head>
<body><div class="app"><header><div class="brand"><span class="dot"></span><h1>9. First Law of Thermodynamics<span class="sub">AP Physics 2 - Unit 9</span></h1></div><div class="actions"><button class="ghost" onclick="location.href='index.html'">Home</button><button class="ghost" data-help>How to use</button><button id="resetBtn">Reset</button></div></header>
<div class="main"><section class="stage"><canvas id="c"></canvas></section><aside class="side"><h2>Energy accounting</h2><div class="readouts"><div class="readout"><div class="k">Q (to system)</div><div class="v" id="qRead">0 J</div></div><div class="readout"><div class="k">W (on system)</div><div class="v" id="wRead">0 J</div></div><div class="readout"><div class="k">ΔU</div><div class="v" id="duRead">0 J</div></div><div class="readout"><div class="k">Temperature</div><div class="v" id="tRead">300 K</div></div><div class="readout"><div class="k">Volume</div><div class="v" id="vRead">4.00 L</div></div><div class="readout"><div class="k">Energy check</div><div class="v" id="checkRead" style="font-size:14px">✓ balanced</div></div></div><div class="row"><button id="heat" class="primary">+ Heat</button><button id="cool">- Heat</button></div><div class="row"><button id="compress" class="primary">Compress</button><button id="expand">Expand</button></div><div class="equation">ΔU = Q + W</div><div class="row"><button id="clear">Clear accounting</button><button id="random">Random challenge</button></div><div class="note" id="status">AP convention: W is work done <b>on</b> the system. Compression gives positive W; expansion gives negative W.</div></aside></div></div>
<div class="help"><button class="close" data-close>Close</button><div class="content"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.querySelectorAll('[id]').forEach(el=>{if(!(el.id in window)) window[el.id]=el;});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(x,d=1)=>Number(x).toFixed(d);
function setupCanvas(id='c'){
 const c=document.getElementById(id),ctx=c.getContext('2d');
 function resize(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
 window.addEventListener('resize',resize);resize();return [c,ctx];
}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grid(ctx,x,y,w,h,nx=6,ny=5){ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let i=0;i<=nx;i++){let xx=x+w*i/nx;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}for(let j=0;j<=ny;j++){let yy=y+h*j/ny;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}ctx.restore()}
function circle(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function bindRange(id,out,fn){const el=document.getElementById(id),o=document.getElementById(out);const go=()=>{o.textContent=fn(+el.value)};el.addEventListener('input',go);go();return el}
function helpText(html){document.querySelector('.help .content').innerHTML=html}
document.addEventListener('click',e=>{if(e.target.matches('[data-help]'))document.querySelector('.help').classList.add('show');if(e.target.matches('[data-close]'))document.querySelector('.help').classList.remove('show')});

helpText('<h3>First Law of Thermodynamics</h3><p>For every action, predict the signs of Q, W and ΔU before pressing the button. The simulation enforces ΔU=Q+W exactly. Work buttons move the piston and use W<sub>on</sub>=−P<sub>ext</sub>ΔV with a fixed model external pressure.</p><p><b>Clear accounting</b> keeps the present physical state but makes it the new reference state; <b>Reset</b> returns to 300 K and 4.00 L.</p>');
const [c,ctx]=setupCanvas();const n=.25,R=8.314,Cv=1.5*n*R,Pwork=400000,Umin=Cv*80,Umax=Cv*900,Vmin=.002,Vmax=.006;let Q=0,W=0,Uref=Cv*300,U=Uref,V=.004,last=performance.now(),ps=[];
function initParticles(){ps=[];for(let i=0;i<65;i++){let a=Math.random()*Math.PI*2,s=.3+Math.random();ps.push({x:Math.random(),y:Math.random(),vx:Math.cos(a)*s,vy:Math.sin(a)*s})}}
function recompute(){U=Uref+Q+W}
function heatStep(desired){let current=Uref+Q+W,applied=desired>0?Math.min(desired,Umax-current):Math.max(desired,Umin-current);Q+=applied;recompute();status.innerHTML=(Math.abs(applied-desired)>.01?'Temperature limit reached; the final heat step was reduced. ':'')+'Energy conservation remains exact: <b>ΔU = Q + W</b>.'}
function workStep(dVdesired){let current=Uref+Q+W,target=clamp(V+dVdesired,Vmin,Vmax),dv=target-V,desiredW=-Pwork*dv;let appliedW=desiredW;if(desiredW>0)appliedW=Math.min(desiredW,Umax-current);else appliedW=Math.max(desiredW,Umin-current);dv=-appliedW/Pwork;V+=dv;W+=appliedW;recompute();status.innerHTML=(Math.abs(target-(V))>1e-8?'Energy/volume limit reached; the final piston step was reduced. ':'')+'Work is calculated from the actual piston displacement, so <b>ΔU = Q + W</b> remains exact.'}
function fullReset(){Q=0;W=0;Uref=Cv*300;U=Uref;V=.004;status.innerHTML='AP convention: W is work done <b>on</b> the system. Compression gives positive W; expansion gives negative W.'}
heat.onclick=()=>heatStep(180);cool.onclick=()=>heatStep(-180);compress.onclick=()=>workStep(-.0004);expand.onclick=()=>workStep(.0004);clear.onclick=()=>{Uref=U;Q=0;W=0;status.innerHTML='Accounting cleared: the current state is now the reference state, so Q=W=ΔU=0.'};
random.onclick=()=>{fullReset();let arr=[[240,0],[-160,0],[130,-100],[220,-140],[-120,180],[80,160]],a=arr[Math.floor(Math.random()*arr.length)];heatStep(a[0]);if(a[1]!==0)workStep(-a[1]/Pwork);status.innerHTML='Random challenge loaded. Check that the three bars satisfy <b>ΔU = Q + W</b>.'};resetBtn.onclick=()=>{fullReset();initParticles()};
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now,w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);let du=Q+W,T=(Uref+du)/Cv,bx=65,by=105,bh=h-175,bw=(w*.56)*(V/Vmax);rounded(ctx,bx,by,bw,bh,18);ctx.fillStyle='rgba(4,12,22,.45)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.32)';ctx.stroke();ctx.fillStyle='#63809a';ctx.fillRect(bx+bw,by-8,14,bh+16);let sT=Math.sqrt(T/300);for(const p of ps){p.x+=p.vx*dt*.27*sT;p.y+=p.vy*dt*.27*sT;if(p.x<0||p.x>1){p.vx*=-1;p.x=clamp(p.x,0,1)}if(p.y<0||p.y>1){p.vy*=-1;p.y=clamp(p.y,0,1)}circle(ctx,bx+8+p.x*(bw-16),by+8+p.y*(bh-16),3,'#78dcca')}
 let baseX=w*.69,baseY=h*.73,maxH=h*.42,maxAbs=Math.max(600,Math.abs(Q),Math.abs(W),Math.abs(du));[['Q',Q,'#ff7b69'],['W',W,'#72a7ff'],['ΔU',du,'#5de1d0']].forEach((a,i)=>{let x=baseX+i*65,val=a[1],hh=Math.min(maxH,Math.abs(val)/maxAbs*maxH);ctx.fillStyle=a[2];ctx.fillRect(x,val>=0?baseY-hh:baseY,36,hh);ctx.fillStyle='#c8d7e3';ctx.font='12px system-ui';ctx.fillText(a[0],x+8,baseY+22);ctx.fillText((val>=0?'+':'')+Math.round(val),x-3,val>=0?baseY-hh-8:baseY+hh+16)});
 qRead.textContent=(Q>=0?'+':'')+Math.round(Q)+' J';wRead.textContent=(W>=0?'+':'')+Math.round(W)+' J';duRead.textContent=(du>=0?'+':'')+Math.round(du)+' J';tRead.textContent=Math.round(T)+' K';vRead.textContent=fmt(V*1000,2)+' L';checkRead.textContent=Math.abs(du-(Q+W))<1e-8?'✓ balanced':'Check';ctx.fillStyle='#edf6ff';ctx.font='700 24px system-ui';ctx.fillText('First Law: track energy crossing the system boundary',65,46);requestAnimationFrame(frame)}
initParticles();requestAnimationFrame(frame);
</script></body></html>
