<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3. Molecular Speed Distributions</title><style>
:root{
  --bg:#07111f; --panel:#0d1b2a; --panel2:#10243a; --ink:#edf6ff; --muted:#9db3c7;
  --accent:#5de1d0; --accent2:#72a7ff; --warn:#ffcc66; --hot:#ff7b69; --cold:#73b7ff;
  --line:rgba(255,255,255,.12); --shadow:0 18px 55px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 20% -10%,#153454 0,transparent 42%),linear-gradient(180deg,#07111f,#081625 55%,#07111f)}
.app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,14,25,.78);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-left:10px;font-weight:500}
header .actions{display:flex;gap:8px;align-items:center}
button,select,input{font:inherit}
button,.navbtn{border:1px solid var(--line);background:#132740;color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:hover,.navbtn:hover{transform:translateY(-1px);border-color:rgba(93,225,208,.5)}button.primary,.navbtn.primary{background:linear-gradient(135deg,#16776d,#1b4f73);border-color:rgba(93,225,208,.45)}button.ghost,.navbtn.ghost{background:transparent}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px}
.stage,.side{min-height:0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(18,39,63,.96),rgba(10,25,42,.96));box-shadow:var(--shadow);overflow:hidden}
.stage{position:relative;display:flex;min-width:0}.stage canvas{width:100%;height:100%;display:block}
.side{padding:14px;overflow:auto;scrollbar-width:thin}.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:2px 0 10px}.control{margin:11px 0 15px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}.control .value{color:var(--accent);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:#5de1d0}.control select{width:100%;background:#10243a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{padding:8px 5px}.choice.active{background:#1d5b6d;border-color:#58d7c8}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.readout{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,14,25,.38);min-width:0}.readout.wide{grid-column:1/-1}.readout .k{font-size:11px;color:var(--muted);line-height:1.25}.readout .v{font-size:17px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.readout .u{font-size:10px;color:var(--muted);margin-left:2px}
.note{font-size:12px;line-height:1.45;color:#bed0df;border-left:3px solid rgba(93,225,208,.45);padding:8px 10px;background:rgba(93,225,208,.06);border-radius:0 10px 10px 0;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tabs button.active{background:#1d5b6d;border-color:#58d7c8}
.equation{font-family:"Cambria Math",Cambria,Georgia,serif;text-align:center;font-size:18px;padding:9px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin:10px 0}
.help{position:fixed;inset:70px 24px 24px;z-index:20;background:rgba(7,17,31,.96);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:none;overflow:auto}.help.show{display:block}.help h3{margin-top:0}.help p,.help li{color:#c6d7e5;line-height:1.55}.help .close{position:absolute;right:14px;top:14px}
.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:62vh auto}.side{overflow:visible}.sub{display:none}}

</style></head>
<body><div class="app"><header><div class="brand"><span class="dot"></span><h1>3. Molecular Speed Distributions<span class="sub">AP Physics 2 - Unit 9</span></h1></div><div class="actions"><a class="navbtn ghost" href="index.html">Home</a><button class="ghost" data-help>How to use</button><button id="resetBtn">Reset</button></div></header>
<div class="main"><section class="stage"><canvas id="c"></canvas></section><aside class="side"><h2>Speed distribution</h2>
<div class="control"><label>Temperature <span class="value" id="tOut"></span></label><input id="temp" type="range" min="100" max="900" value="300" step="10"></div>
<div class="control"><label>Sample size <span class="value" id="nOut"></span></label>
<select id="num"><option value="50">50</option><option value="100">100</option><option value="220" selected>220</option><option value="400">400</option><option value="1000">1,000</option><option value="10000">10,000</option><option value="100000">100,000</option></select></div>
<div class="readouts"><div class="readout"><div class="k">Mean speed</div><div class="v" id="meanRead">-</div></div><div class="readout"><div class="k">rms speed</div><div class="v" id="rmsRead">-</div></div><div class="readout wide"><div class="k">Motion display</div><div class="v" id="displayRead">-</div></div></div>
<div class="row"><button id="resample" class="primary">Resample</button><button id="pauseBtn">Pause motion</button></div>
<div class="note">The histogram and numerical averages use the <b>full selected sample</b>. For very large N, the chamber animates a representative subset so the browser remains responsive.</div></aside></div></div>
<div class="help"><button class="close" data-close>Close</button><div class="content"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.querySelectorAll('[id]').forEach(el=>{if(!(el.id in window)) window[el.id]=el;});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(x,d=1)=>Number(x).toFixed(d);
function sci(x,sig=3){
  if(!Number.isFinite(x)||x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  return `${m.toPrecision(sig)} × 10^${e}`;
}
function setupCanvas(id='c'){
 const c=document.getElementById(id),ctx=c.getContext('2d');
 function resize(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
 window.addEventListener('resize',resize);resize();return [c,ctx];
}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function circle(ctx,x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function bindRange(id,out,fn){const el=document.getElementById(id),o=document.getElementById(out);const go=()=>{o.textContent=fn(+el.value)};el.addEventListener('input',go);go();return el}
function helpText(html){document.querySelector('.help .content').innerHTML=html}
document.addEventListener('click',e=>{if(e.target.matches('[data-help]'))document.querySelector('.help').classList.add('show');if(e.target.matches('[data-close]'))document.querySelector('.help').classList.remove('show')});


helpText('<h3>Molecular speed distributions</h3><p>Choose a temperature and sample size, then resample. The worksheet values 50, 220 and 400 are retained, and you can also examine 100, 1,000, 10,000 and 100,000 particles.</p><ul><li>The histogram uses the full chosen N.</li><li>At N above 2,000, only 2,000 representative molecules are animated.</li><li>Try 150 K, 300 K and 600 K to compare distribution position and width.</li></ul>');
const [c,ctx]=setupCanvas(), kb=1.380649e-23, m=4.65e-26;
let movers=[],bins=[],mean=0,rms=0,paused=false,last=performance.now(),fullN=220;
const temp=bindRange('temp','tOut',x=>x+' K'), num=$('#num');
function updateNLabel(){nOut.textContent=Number(num.value).toLocaleString()+' particles'}
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function sample(){
  const T=+temp.value; fullN=+num.value; updateNLabel();
  const sigma=Math.sqrt(kb*T/m), binCount=32, maxV=2000;
  bins=Array(binCount).fill(0); let sum=0,sum2=0;
  const displayN=Math.min(fullN,2000); movers=[];
  for(let i=0;i<fullN;i++){
    const vx=gauss()*sigma,vy=gauss()*sigma,vz=gauss()*sigma,s=Math.hypot(vx,vy,vz);
    sum+=s;sum2+=s*s;const b=Math.floor(s/maxV*binCount);if(b>=0&&b<binCount)bins[b]++;
    if(i<displayN){const a=Math.random()*Math.PI*2;movers.push({x:Math.random(),y:Math.random(),vx:Math.cos(a)*s,vy:Math.sin(a)*s})}
  }
  mean=sum/fullN;rms=Math.sqrt(sum2/fullN);
  meanRead.textContent=Math.round(mean)+' m/s';rmsRead.textContent=Math.round(rms)+' m/s';
  displayRead.textContent=fullN<=2000?`${fullN.toLocaleString()} / ${fullN.toLocaleString()} particles`:`2,000 representative / ${fullN.toLocaleString()} sampled`;
}
temp.addEventListener('change',sample);num.addEventListener('change',sample);resample.onclick=sample;
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Resume motion':'Pause motion'};
resetBtn.onclick=()=>{temp.value=300;temp.dispatchEvent(new Event('input'));num.value='220';paused=false;pauseBtn.textContent='Pause motion';sample()};
function drawAxis(ctx,x,y,w,h){
 ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();
 ctx.fillStyle='#9db3c7';ctx.font='11px system-ui';
 [0,500,1000,1500,2000].forEach(v=>{const xx=x+v/2000*w;ctx.strokeStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke();ctx.fillStyle='#9db3c7';ctx.fillText(String(v),xx-12,y+h+16)});
 ctx.fillText('speed (m/s)',x+w-72,y+h-8);ctx.save();ctx.translate(x+12,y+44);ctx.rotate(-Math.PI/2);ctx.fillText('fraction per bin',0,0);ctx.restore();
}
function frame(now){
 const dt=Math.min(.04,(now-last)/1000);last=now;const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);
 const topH=Math.max(190,h*.45),x=40,y=65,bw=w-80,bh=topH-82;rounded(ctx,x,y,bw,bh,16);ctx.fillStyle='rgba(4,12,22,.42)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
 if(!paused){for(const p of movers){const k=.20;p.x+=p.vx*k*dt/Math.max(bw,1);p.y+=p.vy*k*dt/Math.max(bh,1);if(p.x<0){p.x=-p.x;p.vx*=-1}if(p.x>1){p.x=2-p.x;p.vx*=-1}if(p.y<0){p.y=-p.y;p.vy*=-1}if(p.y>1){p.y=2-p.y;p.vy*=-1}}}
 const rad=fullN>10000?1.0:fullN>1000?1.35:2.3;for(const p of movers)circle(ctx,x+5+p.x*(bw-10),y+5+p.y*(bh-10),rad,'rgba(120,220,202,.78)');
 const gx=62,gy=topH+14,gw=w-120,gh=Math.max(100,h-topH-58);drawAxis(ctx,gx,gy,gw,gh);
 const denom=Math.max(fullN,1), maxFrac=.16;
 for(let i=0;i<bins.length;i++){const frac=bins[i]/denom,barH=Math.min(1,frac/maxFrac)*(gh-22);ctx.fillStyle='rgba(93,225,208,.72)';ctx.fillRect(gx+i*gw/bins.length+1.5,gy+gh-barH,Math.max(1,gw/bins.length-3),barH)}
 ctx.fillStyle='#edf6ff';ctx.font='700 22px system-ui';ctx.fillText('A gas has a distribution of molecular speeds',40,35);
 ctx.fillStyle='#9db3c7';ctx.font='12px system-ui';ctx.fillText(`Histogram sample: N = ${fullN.toLocaleString()} • temperature = ${temp.value} K`,40,54);
 requestAnimationFrame(frame);
}
sample();requestAnimationFrame(frame);
</script></body></html>
